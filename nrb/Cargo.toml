[package]
name = "nrb"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "netrunner-browser: браузер + узел NRXP"

[features]
default = []
# Движок Servo (тяжёлая сборка). Без неё бинарь собирается за секунды — для узла/тестов.
servo = ["dep:nrb-engine-servo", "dep:nrb-shell"]
# <video>/<audio> через системный GStreamer (см. nrb-engine-servo).
media = ["servo", "nrb-engine-servo/media"]
# Страницы в отдельных процессах (NRB_MULTIPROCESS=1, песочница NRB_SANDBOX=1); экспериментально.
multiprocess = ["servo", "nrb-engine-servo/multiprocess"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
nrb-engine = { path = "../crates/nrb-engine" }
nrb-net = { path = "../crates/nrb-net" }
nrb-deploy = { path = "../crates/nrb-deploy" }
nrb-node = { path = "../crates/nrb-node" }
nrb-adblock = { path = "../crates/nrb-adblock" }
nrb-userscripts = { path = "../crates/nrb-userscripts" }
nrb-hermetic = { path = "../crates/nrb-hermetic" }
nrb-update = { path = "../crates/nrb-update" }
libc = "0.2"
nrb-transport = { path = "../crates/nrb-transport" }
tokio.workspace = true
nrb-engine-servo = { path = "../crates/nrb-engine-servo", optional = true }
nrb-shell = { path = "../crates/nrb-shell", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
humantime = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
