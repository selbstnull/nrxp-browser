[package]
name = "nrb"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "netrunner-browser: браузер + узел NRXP"

[features]
default = []
# Движок Servo (тяжёлая сборка). Без неё бинарь собирается за секунды — для узла/тестов.
servo = ["dep:nrb-engine-servo"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
nrb-engine = { path = "../crates/nrb-engine" }
nrb-engine-servo = { path = "../crates/nrb-engine-servo", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
humantime = "2"
