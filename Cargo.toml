[workspace]
resolver = "2"
members = ["nrb", "crates/nrb-engine"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
