[workspace]
resolver = "2"
# Вложенный worktree соседнего netrunner-proxy (scripts/setup-upstream.sh) — не часть нашего воркспейса.
exclude = [".nrb-dev"]
members = ["nrb", "crates/nrb-engine", "crates/nrb-engine-servo", "crates/nrb-shell", "crates/nrb-transport", "crates/nrb-net", "crates/nrb-profile", "crates/nrb-node", "crates/nrb-deploy", "crates/nrb-adblock", "crates/nrb-userscripts", "crates/nrb-hermetic"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
# Размер бинаря: без отладочных символов (с Servo они занимают сотни МБ). Для профилирования — `CARGO_PROFILE_RELEASE_STRIP=none`.
strip = "symbols"
