[workspace]
resolver = "2"
# Вложенный worktree соседнего netrunner-proxy (scripts/setup-upstream.sh) — не часть нашего воркспейса.
exclude = [".nrb-dev"]
members = ["nrb", "crates/nrb-engine", "crates/nrb-engine-servo", "crates/nrb-shell", "crates/nrb-transport", "crates/nrb-net", "crates/nrb-profile", "crates/nrb-node", "crates/nrb-deploy", "crates/nrb-adblock", "crates/nrb-userscripts", "crates/nrb-hermetic"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Servo с нашими патчами (patches/servo; готовит scripts/setup-upstream.sh): WebSocket обязан ходить через прокси,
# иначе при работе через туннель он открывает прямое соединение (утечка IP).
[patch.crates-io]
servo-net = { path = ".nrb-dev/servo-net" }
