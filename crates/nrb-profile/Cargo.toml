[package]
name = "nrb-profile"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Данные профиля браузера: история, закладки, сессия, настройки (SQLite + TOML)"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "0.9"
url.workspace = true

[dev-dependencies]
tempfile = "3"
