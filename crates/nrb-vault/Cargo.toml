[package]
name = "nrb-vault"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Хранилище паролей браузера: файл в профиле, шифр XChaCha20-Poly1305, ключ из мастер-пароля через Argon2id"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
