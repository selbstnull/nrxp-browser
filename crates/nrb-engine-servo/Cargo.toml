[package]
name = "nrb-engine-servo"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Реализация nrb-engine на Servo"

[features]
default = []
# Воспроизведение <video>/<audio> через системный GStreamer (нужны libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev,
# libgstreamer-plugins-bad1.0-dev при сборке и gstreamer1.0-plugins-good/-libav при запуске). Без неё медиа не играет.
media = ["servo/media-gstreamer"]
# Страницы в отдельных процессах (контент-процессы запускаются тем же бинарём с `--content-process <токен>`, см. `run_content_process`) и, по
# желанию, в песочнице (`NRB_SANDBOX=1`). Экспериментально: в Servo 0.7 режим помечен как неполный.
multiprocess = ["servo/multiprocess"]

[dependencies]
nrb-engine = { path = "../nrb-engine" }
nrb-transport = { path = "../nrb-transport" }
nrb-net = { path = "../nrb-net" }
# Версия зафиксирована: API встраивания меняется каждый месяц.
servo = { version = "=0.7.0", default-features = false, features = ["bundled_freetype", "js_jit", "webcrypto", "webgl", "clipboard", "brotli-compression-stream"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
dpi = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
